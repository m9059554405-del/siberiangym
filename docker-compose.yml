services:
  postgres:
    image: postgres:16-alpine
    container_name: siberiangym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siberiangym
      POSTGRES_PASSWORD: siberiangym_dev_password
      POSTGRES_DB: siberiangym
    ports:
      - "5433:5432"
    volumes:
      - siberiangym_pg_data:/var/lib/postgresql/data

volumes:
  siberiangym_pg_data:
