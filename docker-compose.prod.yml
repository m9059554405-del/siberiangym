# Продакшн-развёртывание одним docker compose на VPS: Postgres + API + web
# (nginx) + Caddy (TLS-терминатор, P0.3).
#
# HTTPS/домен — управляется одной переменной DOMAIN в .env.prod:
# пустая (по умолчанию) — Caddy слушает :80 без TLS, приложение доступно
# по IP как раньше; заполненная реальным доменом (когда его A-запись уже
# указывает на этот сервер) — Caddy сам получает и продлевает сертификат
# Let's Encrypt, ничего больше менять не нужно, см. DEPLOY_GUIDE.md, часть 5.
#
# P3.16: у КАЖДОГО сервиса явно ограничен размер логов Docker (x-logging
# ниже) — без секции logging действует дефолтный json-file БЕЗ ограничений,
# и контейнер за месяцы работы заполняет диск неограниченным логом до
# аварийной остановки Postgres. 10 МБ × 3 файла = максимум 30 МБ на сервис.
#
# Раньше (до 0.17.0) это поведение описывалось в README/DEPLOY_GUIDE.md как
# "поставьте Caddy на хосте вручную, в docker-compose менять ничего не
# придётся" — то решение пересмотрено: ручной Caddy на хосте конфликтовал
# бы за порт 80 с уже запущенным контейнером web (см. CHANGELOG, P0.3) и
# требовал отдельной установки/апдейтов пакета в обход Docker.
#
# Использование:
#   cp .env.prod.example .env.prod   # и заполнить реальными значениями
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# name ниже — явное имя проекта Docker Compose, а не техническая деталь:
# без него Docker Compose берёт имя проекта из имени папки, а `docker-
# compose.yml` (локальная БД для разработки, в этой же папке) объявляет
# volume с тем же именем (siberiangym_pg_data) — без явного разного имени
# проекта у двух файлов оба резолвятся в один и тот же volume, и `up` от
# одного файла тихо переиспользует (и может пересоздать/сломать доступ к)
# данные, поднятые другим. Проверено на практике при разработке этого
# файла — см. CHANGELOG, P0.3.
name: siberiangym-prod

# P3.16: единая политика ротации логов для всех сервисов (json-file,
# max-size+max-file — Docker сам ротирует и удаляет старые файлы).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: siberiangym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: siberiangym
    volumes:
      - siberiangym_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siberiangym"]
      interval: 5s
      timeout: 5s
      retries: 10
    # P3.25: лимиты Postgres — база важнее всех, но и её тяжёлый запрос не
    # должен съедать весь хост.
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT:-2.0}"
          memory: "${POSTGRES_MEMORY_LIMIT:-3g}"

  api:
    build: ./api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # P3.14: connection_limit задан явно (а не дефолт Prisma «физические
      # ядра машины × 2 + 1»): один процесс API (до P3.18), 12 соединений с
      # запасом под пиковую нагрузку одного инстанса, при этом суммарно с
      # Postgres-супервизором и мониторингом далеко от потолка в 100
      # соединений. При переходе на PM2-кластер (P3.18) снизить до
      # ~15/N инстансов.
      DATABASE_URL: postgresql://siberiangym:${POSTGRES_PASSWORD}@postgres:5432/siberiangym?connection_limit=${DATABASE_CONNECTION_LIMIT:-12}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: 604800
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      API_RATE_WINDOW_MS: ${API_RATE_WINDOW_MS:-60000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_MS: ${LOGIN_RATE_WINDOW_MS:-60000}
      LOGIN_BLOCK_DURATION_MS: ${LOGIN_BLOCK_DURATION_MS:-300000}
      PASSWORD_RESET_TTL_MINUTES: ${PASSWORD_RESET_TTL_MINUTES:-30}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SiberianGym <no-reply@siberiangym.ru>}
      SEED_CEO_EMAIL: ${SEED_CEO_EMAIL:-ceo@siberiangym.ru}
      SEED_CEO_PASSWORD: ${SEED_CEO_PASSWORD}
      GYM_LEGAL_NAME: ${GYM_LEGAL_NAME:-}
      GYM_CLUB_NAME: ${GYM_CLUB_NAME:-SiberianGym}
      # Объектное хранилище для фото (P0.5) — целевая конфигурация сервера
      # предполагает ОТДЕЛЬНОЕ S3-совместимое хранилище (например Selectel
      # S3), не MinIO на этом же VPS — поэтому здесь только переменные
      # подключения к уже существующему внешнему S3, самого сервиса MinIO
      # в этом файле нет (в отличие от docker-compose.yml для разработки).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-siberiangym-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    # P3.25: healthcheck по публичному /api/health (проверяет и БД) —
    # мониторинг и depends_on видят реальное состояние приложения, а не
    # просто «процесс жив». curl в slim-образе есть.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # P3.25: явные лимиты ресурсов — разросшийся процесс (утечка, тяжёлый
    # запрос) падает изолированно по OOM, а не душит Postgres и Caddy на
    # хосте; значения под целевую конфигурацию 6 vCPU / 12 ГБ.
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-2.0}"
          memory: "${API_MEMORY_LIMIT:-1536M}"

  monitor:
    image: alpine:3.20
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      MONITOR_HEALTH_URL: http://api:3000/api/health
      MONITOR_MIN_FREE_PERCENT: ${MONITOR_MIN_FREE_PERCENT:-15}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
    volumes:
      - ./scripts/monitor-siberiangym.sh:/monitor-siberiangym.sh:ro
      - monitor_state:/var/lib/siberiangym-monitor
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache bash curl coreutils >/dev/null && while true; do /bin/bash /monitor-siberiangym.sh; sleep 60; done"]

  web:
    build: ./web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    # P3.25: лимит и для статики — nginx лёгкий, но без лимита любой
    # процесс может съесть хост.
    deploy:
      resources:
        limits:
          cpus: "${WEB_CPU_LIMIT:-0.5}"
          memory: "${WEB_MEMORY_LIMIT:-256M}"
    # Порт 80 наружу не публикуется — единственная внешняя точка входа
    # теперь caddy (ниже). web доступен внутри docker-сети как http://web:80.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    deploy:
      resources:
        limits:
          cpus: "${CADDY_CPU_LIMIT:-0.5}"
          memory: "${CADDY_MEMORY_LIMIT:-256M}"
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Пустая/незаданная переменная — Caddy слушает :80 без TLS, реальный
      # домен — включает автоматический HTTPS. Вычисление ADDR из DOMAIN
      # сделано в caddy-entrypoint.sh (не в самом Caddyfile — см. Caddyfile).
      DOMAIN: ${DOMAIN:-}
    entrypoint: ["/bin/sh", "/caddy-entrypoint.sh"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  siberiangym_pg_data:
  caddy_data:
  caddy_config:
  monitor_state:
