# Продакшн-развёртывание одним docker compose на VPS: Postgres + API + web
# (nginx) + Caddy (TLS-терминатор, P0.3).
#
# HTTPS/домен — управляется одной переменной DOMAIN в .env.prod:
# пустая (по умолчанию) — Caddy слушает :80 без TLS, приложение доступно
# по IP как раньше; заполненная реальным доменом (когда его A-запись уже
# указывает на этот сервер) — Caddy сам получает и продлевает сертификат
# Let's Encrypt, ничего больше менять не нужно, см. DEPLOY_GUIDE.md, часть 5.
#
# Раньше (до 0.17.0) это поведение описывалось в README/DEPLOY_GUIDE.md как
# "поставьте Caddy на хосте вручную, в docker-compose менять ничего не
# придётся" — то решение пересмотрено: ручной Caddy на хосте конфликтовал
# бы за порт 80 с уже запущенным контейнером web (см. CHANGELOG, P0.3) и
# требовал отдельной установки/апдейтов пакета в обход Docker.
#
# Использование:
#   cp .env.prod.example .env.prod   # и заполнить реальными значениями
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# name ниже — явное имя проекта Docker Compose, а не техническая деталь:
# без него Docker Compose берёт имя проекта из имени папки, а `docker-
# compose.yml` (локальная БД для разработки, в этой же папке) объявляет
# volume с тем же именем (siberiangym_pg_data) — без явного разного имени
# проекта у двух файлов оба резолвятся в один и тот же volume, и `up` от
# одного файла тихо переиспользует (и может пересоздать/сломать доступ к)
# данные, поднятые другим. Проверено на практике при разработке этого
# файла — см. CHANGELOG, P0.3.
name: siberiangym-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: siberiangym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: siberiangym
    volumes:
      - siberiangym_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siberiangym"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://siberiangym:${POSTGRES_PASSWORD}@postgres:5432/siberiangym
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: 604800
      API_RATE_LIMIT: ${API_RATE_LIMIT:-120}
      API_RATE_WINDOW_MS: ${API_RATE_WINDOW_MS:-60000}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW_MS: ${LOGIN_RATE_WINDOW_MS:-60000}
      LOGIN_BLOCK_DURATION_MS: ${LOGIN_BLOCK_DURATION_MS:-300000}
      PORT: 3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SiberianGym <no-reply@siberiangym.ru>}
      SEED_CEO_EMAIL: ${SEED_CEO_EMAIL:-ceo@siberiangym.ru}
      SEED_CEO_PASSWORD: ${SEED_CEO_PASSWORD}
      GYM_LEGAL_NAME: ${GYM_LEGAL_NAME:-}
      GYM_CLUB_NAME: ${GYM_CLUB_NAME:-SiberianGym}
      # Объектное хранилище для фото (P0.5) — целевая конфигурация сервера
      # предполагает ОТДЕЛЬНОЕ S3-совместимое хранилище (например Selectel
      # S3), не MinIO на этом же VPS — поэтому здесь только переменные
      # подключения к уже существующему внешнему S3, самого сервиса MinIO
      # в этом файле нет (в отличие от docker-compose.yml для разработки).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-siberiangym-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    # Порт 80 наружу не публикуется — единственная внешняя точка входа
    # теперь caddy (ниже). web доступен внутри docker-сети как http://web:80.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Пустая/незаданная переменная — Caddy слушает :80 без TLS, реальный
      # домен — включает автоматический HTTPS. Вычисление ADDR из DOMAIN
      # сделано в caddy-entrypoint.sh (не в самом Caddyfile — см. Caddyfile).
      DOMAIN: ${DOMAIN:-}
    entrypoint: ["/bin/sh", "/caddy-entrypoint.sh"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  siberiangym_pg_data:
  caddy_data:
  caddy_config:
