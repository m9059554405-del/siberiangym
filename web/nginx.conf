server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API — тот же origin, что и фронтенд, чтобы не настраивать CORS и
    # не заводить отдельный публичный адрес для backend. Имя "api" —
    # сервис из docker-compose.prod.yml (Docker DNS в общей сети).
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HashRouter — приложение живёт на одном index.html, отдельных путей
    # на сервере нет, перезапись не нужна.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker и манифест не должны залипать в кэше браузера —
    # иначе обновления PWA не будут доходить до пользователей.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
